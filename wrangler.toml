name = "cloudflare-stats-worker"
main = "src/index.js"
compatibility_date = "2025-10-07"
compatibility_flags = ["nodejs_compat"]

# Workers Cache — caches responses in front of the Worker, keyed on the full URL.
# This is what makes the Cache-Control headers in src/index.js actually do
# something: the older `caches.default` API is a silent no-op on *.workers.dev,
# so until now nothing was ever cached. Read endpoints send a 24h max-age for
# date ranges that have already closed and 5m for anything touching today.
# `cross_version_cache` is deliberately left off so a deploy invalidates.
[cache]
enabled = true

# --- Per-deployment configuration (edit these to reuse for another site) ---
[vars]
ALLOWED_ORIGIN        = "https://blog.example.com"   # the ONE website allowed to report (+ 127.0.0.1/localhost for dev)
RECORD_LOCALHOST      = "true"                        # set to "true" to record events from localhost/127.0.0.1 origins
RATE_LIMIT_PER_MINUTE = "120"                          # documented per-IP ingest cap; the ENFORCED value is the [[ratelimits]] `limit` below — keep them in sync
TIMEZONE              = "Asia/Tokyo"                   # day-boundary timezone (default: Japan)

# Per-IP ingest rate limit — atomic, edge-enforced via the Workers Rate Limiting
# binding (free plan; no storage cost). Replaces the old non-atomic KV bucket.
# `period` must be 10 or 60 (seconds); limits are per-Cloudflare-location (colo).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Dashboard SPA (built by: pnpm --dir dashboard-v2 build)
[assets]
directory = "./dashboard-v2/dist"
binding   = "ASSETS"

# Nightly maintenance: refresh daily rollup, archive + prune data > 6 months.
# 15:30 UTC = 00:30 Asia/Tokyo, after the local day has closed.
[triggers]
crons = ["30 15 * * *"]

# D1 database — single source of truth for all analytics.
# Create with: wrangler d1 create cloudflare_stats_db
[[d1_databases]]
binding = "DB"
database_name = "cloudflare_stats_db"
database_id = "61645b6f-91cd-4716-bbd0-8b15ca2efdec"

# Live dashboard relay — single in-memory Durable Object instance that gates a
# lone WebSocket viewer and fans out raw pageview events to it. No persistence
# (no ctx.storage), so it needs no D1-style backup/migration story. SQLite
# storage backend keeps it on the Workers Free plan (the legacy KV-backed
# class would require Workers Paid).
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "RealtimeHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHub"]
